[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/template",
    "crates/engine",
    "crates/protocols",
    "crates/discovery",
    "crates/fingerprint",
    "bin/alive",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Alive contributors"]
repository = "https://github.com/zoukba0014/Alive"

# Shared dependency versions. Individual crates opt in via `dep = { workspace = true }`.
[workspace.dependencies]
# Core / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"       # maintained fork; upstream serde_yaml is archived
thiserror = "2"
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# Matching / IO
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
# Network discovery / fingerprinting
ipnet = "2"
surge-ping = "0.8"
murmur3 = "0.5"
base64 = "0.22"
# Internal crates
alive-core = { path = "crates/core" }
alive-config = { path = "crates/config" }
alive-template = { path = "crates/template" }
alive-engine = { path = "crates/engine" }
alive-protocols = { path = "crates/protocols" }
alive-discovery = { path = "crates/discovery" }
alive-fingerprint = { path = "crates/fingerprint" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
