[workspace]
resolver = "2"
members = [
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Alive contributors"]
repository = "https://github.com/zoukba0014/Alive"

# Shared dependency versions. Individual crates opt in via `dep = { workspace = true }`.
[workspace.dependencies]
# Core / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Async runtime (used from M1 onward)
tokio = { version = "1", features = ["full"] }
# Internal crates
alive-core = { path = "crates/core" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
