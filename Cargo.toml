[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/template",
    "crates/dsl",
    "crates/engine",
    "crates/protocols",
    "crates/discovery",
    "crates/fingerprint",
    "crates/ai",
    "crates/report",
    "crates/brute",
    "crates/oob",
    "crates/proto",
    "crates/transport",
    "bin/alive",
    "bin/alive-server",
    "bin/alive-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Alive contributors"]
repository = "https://github.com/zoukba0014/Alive"

# Shared dependency versions. Individual crates opt in via `dep = { workspace = true }`.
[workspace.dependencies]
# Core / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"       # maintained fork; upstream serde_yaml is archived
thiserror = "2"
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# Matching / IO
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
csv = "1"
# Network discovery / fingerprinting
ipnet = "2"
surge-ping = "0.8"
murmur3 = "0.5"
base64 = "0.22"
# DSL expression engine + crypto/encoding helpers (nuclei dsl functions)
evalexpr = "11"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"
# TCP/TLS runners
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
x509-parser = "0.16"
# Fleet: gRPC, mTLS, signing
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"
tokio-stream = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rcgen = "0.13"
rand = "0.8"
# Internal crates
alive-core = { path = "crates/core" }
alive-proto = { path = "crates/proto" }
alive-transport = { path = "crates/transport" }
alive-config = { path = "crates/config" }
alive-template = { path = "crates/template" }
alive-dsl = { path = "crates/dsl" }
alive-engine = { path = "crates/engine" }
alive-protocols = { path = "crates/protocols" }
alive-discovery = { path = "crates/discovery" }
alive-fingerprint = { path = "crates/fingerprint" }
alive-ai = { path = "crates/ai" }
alive-report = { path = "crates/report" }
alive-brute = { path = "crates/brute" }
alive-oob = { path = "crates/oob" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
