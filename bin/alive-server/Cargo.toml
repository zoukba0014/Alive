[package]
name = "alive-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Alive fleet control plane: schedules and dispatches signed tasks, ingests results, audits."

[lib]
name = "alive_server"
path = "src/lib.rs"

[[bin]]
name = "alive-server"
path = "src/main.rs"

[dependencies]
alive-core = { workspace = true }
alive-config = { workspace = true }
alive-proto = { workspace = true }
alive-transport = { workspace = true }
alive-report = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
alive-agent = { path = "../alive-agent" }
